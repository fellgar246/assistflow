[project]
name = "assistflow-returns"
version = "0.1.0"
description = "Return requests and return eligibility"
requires-python = ">=3.12"
dependencies = [
    "assistflow-contracts",
    "assistflow-customers",
    "assistflow-orders",
    "assistflow-shipping",
    "sqlalchemy>=2",
]

[tool.uv.sources]
assistflow-contracts = { workspace = true }
assistflow-customers = { workspace = true }
assistflow-orders = { workspace = true }
assistflow-shipping = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
