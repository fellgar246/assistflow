[project]
name = "assistflow-refunds"
version = "0.1.0"
description = "Refund requests and refund eligibility"
requires-python = ">=3.12"
dependencies = [
    "assistflow-contracts",
    "assistflow-conversations",
    "assistflow-customers",
    "assistflow-orders",
    "assistflow-returns",
    "sqlalchemy>=2",
]

[tool.uv.sources]
assistflow-contracts = { workspace = true }
assistflow-conversations = { workspace = true }
assistflow-customers = { workspace = true }
assistflow-orders = { workspace = true }
assistflow-returns = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
