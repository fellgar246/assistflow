[project]
name = "assistflow-api"
version = "0.1.0"
description = "AssistFlow HTTP API"
requires-python = ">=3.12"
dependencies = [
    "assistflow-contracts",
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "sqlalchemy>=2",
    "structlog>=24",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "assistflow-test-fixtures",
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.uv.sources]
assistflow-contracts = { workspace = true }
assistflow-test-fixtures = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ["alembic"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
