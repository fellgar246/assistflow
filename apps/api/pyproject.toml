[project]
name = "assistflow-api"
version = "0.1.0"
description = "AssistFlow HTTP API"
requires-python = ">=3.12"
dependencies = [
    "assistflow-contracts",
    "assistflow-conversations",
    "assistflow-customers",
    "assistflow-orders",
    "assistflow-shipping",
    "assistflow-returns",
    "assistflow-refunds",
    "assistflow-tickets",
    "assistflow-runtime",
    "assistflow-tools",
    "assistflow-knowledge",
    "assistflow-test-fixtures",
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "sqlalchemy>=2",
    "structlog>=24",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.uv.sources]
assistflow-contracts = { workspace = true }
assistflow-conversations = { workspace = true }
assistflow-customers = { workspace = true }
assistflow-orders = { workspace = true }
assistflow-shipping = { workspace = true }
assistflow-returns = { workspace = true }
assistflow-refunds = { workspace = true }
assistflow-tickets = { workspace = true }
assistflow-runtime = { workspace = true }
assistflow-tools = { workspace = true }
assistflow-knowledge = { workspace = true }
assistflow-test-fixtures = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "src",
    "tests",
    "../../services/conversations/src",
    "../../services/customers/src",
    "../../services/orders/src",
    "../../services/shipping/src",
    "../../services/returns/src",
    "../../services/refunds/src",
    "../../services/tickets/src",
    "../../services/knowledge/src",
    "../../packages/contracts/src",
    "../../packages/test-fixtures/src",
    "../../agent/runtime/src",
    "../../agent/tools/src",
]
exclude = ["alembic"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests", "../../agent/tools/tests"]
